<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Robit CRM</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#1a1a1a;direction:rtl}
#lockScreen{display:none;position:fixed;inset:0;background:#1d2b4f;z-index:9999;align-items:center;justify-content:center}
.lbox{background:#fff;border-radius:16px;padding:40px 32px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lbox h2{font-size:22px;font-weight:700;color:#1d2b4f;margin:10px 0 6px}
.lbox p{font-size:13px;color:#6b7280;margin-bottom:20px}
.lbox input{width:100%;padding:12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:15px;text-align:center;letter-spacing:3px;margin-bottom:12px;font-family:Arial;outline:none}
.lbox button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:Arial}
#lockErr{color:#dc2626;font-size:12px;margin-top:8px;min-height:16px}
.topbar{background:#1d2b4f;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;color:#fff;font-weight:700}
.sub{font-size:11px;color:#8fa3c8;margin-top:1px}
.main{padding:20px 24px;max-width:1300px;margin:0 auto}
.alerts-bar{background:#fff;border:1px solid #fde68a;border-radius:10px;padding:10px 16px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ai{font-size:12px;color:#92400e;background:#fef3c7;padding:3px 10px;border-radius:20px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #e8e8e8}
.stat .lbl{font-size:11px;color:#888;margin-bottom:4px}
.stat .val{font-size:22px;font-weight:700}
.filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.filters input,.filters select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;font-family:Arial}
.filters input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 14px rgba(0,0,0,.09)}
.card.warn{border-right:4px solid #f59e0b}
.card.danger{border-right:4px solid #dc2626}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.av-b{background:#dbeafe;color:#1e40af}.av-t{background:#d1fae5;color:#065f46}
.av-p{background:#ede9fe;color:#5b21b6}.av-c{background:#fee2e2;color:#991b1b}.av-g{background:#dcfce7;color:#14532d}
.cname{font-size:14px;font-weight:700}.cagent{font-size:12px;color:#666}
.hbar{margin:6px 0 10px;background:#f0f0f0;border-radius:20px;height:6px;overflow:hidden}
.hbar div{height:6px;border-radius:20px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.bs{background:#dbeafe;color:#1e40af}.be{background:#ede9fe;color:#5b21b6}
.bp{background:#d1fae5;color:#065f46}.bw{background:#fef3c7;color:#92400e}
.cmeta{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;border-top:1px solid #f0f0f0;padding-top:9px}
.ml{color:#999;font-size:11px}.mv{font-weight:600;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px}
.dg{background:#16a34a}.do{background:#ea580c}.dr{background:#dc2626}
.ca{display:flex;gap:6px;margin-top:10px;border-top:1px solid #f5f5f5;padding-top:10px}
.btn{border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-family:Arial;border:1px solid transparent}
.btn-white{background:#fff;color:#1d2b4f;border-color:#ddd}
.btn-blue{background:#2563eb;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-gray{background:#6b7280;color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;margin:auto;overflow:hidden}
.mh{background:#1d2b4f;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.mh h2{font-size:16px;color:#fff;font-weight:700}
.xbtn{background:transparent;border:none;cursor:pointer;font-size:18px;color:#aaa;padding:2px 6px}
.mb{padding:20px;max-height:75vh;overflow-y:auto}
.tabs{display:flex;border-bottom:2px solid #f0f0f0;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 11px;font-size:12px;cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;color:#666;font-family:Arial;font-weight:600;margin-bottom:-2px}
.tab.on{color:#2563eb;border-bottom-color:#2563eb}
.tc{display:none}.tc.on{display:block}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ir{margin-bottom:10px}
.ir label{display:block;font-size:11px;color:#888;margin-bottom:3px;font-weight:600;text-transform:uppercase}
.ir .v{font-size:14px;font-weight:600}
.st{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 7px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f8f9fa;border-radius:8px;margin-bottom:5px;font-size:13px}
.pbox{background:#f8f9fa;border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid #e8e8e8}
.li{padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.li:last-child{border-bottom:none}
.ld{font-size:11px;color:#999;margin-top:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:12px;color:#555;font-weight:700}
.fg input,.fg select,.fg textarea{padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;font-family:Arial}
.fg textarea{resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:4px 10px;border:1px solid #ddd;border-radius:20px;cursor:pointer;background:#fff}
.tag.on{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem;padding-top:.75rem;border-top:1px solid #f0f0f0}
.div{height:1px;background:#f0f0f0;margin:12px 0}
.roi-box{background:linear-gradient(135deg,#1d2b4f,#2563eb);border-radius:12px;padding:16px;color:#fff;margin-bottom:14px}
.roi-big{font-size:32px;font-weight:700}
.roi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.rc{background:rgba(255,255,255,.12);border-radius:8px;padding:8px;text-align:center}
.rc .rl{font-size:10px;opacity:.7;margin-bottom:2px}
.rc .rv{font-size:15px;font-weight:700}
.doc-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8f9fa;border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;background:#eff6ff;border:1px solid #bfdbfe;border-radius:20px;padding:3px 10px;font-size:12px;color:#1e40af;text-decoration:none}
.qa{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:Arial;line-height:1.7;min-height:200px;resize:vertical;background:#fafafa}
.hbig{font-size:48px;font-weight:700;text-align:center;margin:8px 0 4px}
.hck{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:4px}
.hck.pass{background:#f0fdf4;color:#166534}
.hck.fail{background:#fef2f2;color:#991b1b}
.hck.warn{background:#fffbeb;color:#92400e}
.saving{position:fixed;bottom:20px;left:20px;background:#16a34a;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-family:Arial;z-index:9998;display:none}
</style>
</head>

<script>
const FB = firebase.initializeApp({
  apiKey:"AIzaSyD7G1BmHGq_eAF8tSuv68LArR6luKHuVKM",
  authDomain:"robitc.firebaseapp.com",
  projectId:"robitc",
  storageBucket:"robitc.firebasestorage.app",
  messagingSenderId:"185301314302",
  appId:"1:185301314302:web:cf35c8156bd6e6351413af"
});
const db = firebase.firestore(FB);
const COL = 'crm_v2';

// Lock
function ck(){
  if(document.getElementById('lp').value==='Yamanbar2026!'){
    sessionStorage.setItem('ok','1');
    document.getElementById('lockScreen').style.display='none';
  } else {
    document.getElementById('le').textContent='\u05e1\u05d9\u05e1\u05de\u05d0 \u05e9\u05d2\u05d5\u05d9\u05d0\u05d4';
    document.getElementById('lp').value='';
  }
}
if(sessionStorage.getItem('ok')!=='1') document.getElementById('lockScreen').style.display='flex';

const AVC=['av-b','av-t','av-p','av-c','av-g'];
const DCATS=['\u05d7\u05d5\u05d6\u05d4','\u05d4\u05e6\u05e2\u05ea \u05de\u05d7\u05d9\u05e8 \u05de\u05d0\u05d5\u05e9\u05e8\u05ea','\u05d0\u05d9\u05e9\u05d5\u05e8 \u05ea\u05e9\u05dc\u05d5\u05dd','\u05d3\u05d5\u05d7 \u05d1\u05d9\u05e6\u05d5\u05e2\u05d9\u05dd','\u05de\u05e1\u05de\u05da \u05de\u05e9\u05e4\u05d8\u05d9','\u05d0\u05d7\u05e8'];
function ini(n){return(n||'').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()}
function days(d){if(!d)return 9999;return Math.ceil((new Date(d)-new Date())/(864e5))}
function tenure(d){if(!d)return '\u2014';const m=Math.floor((Date.now()-new Date(d))/(864e5*30));return m>=12?Math.floor(m/12)+' \u05e9\u05e0\u05d9\u05dd':m+' \u05d7\u05f3'}
function fd(d){return d?d.split('-').reverse().join('/'):'\u2014'}
function dc(s){return s==='\u05e9\u05d5\u05dc\u05dd'?'dg':s==='\u05de\u05de\u05ea\u05d9\u05df'?'do':'dr'}
function hc(s){return s>=80?'#16a34a':s>=50?'#ea580c':'#dc2626'}
function cROI(r){if(!r||!r.rv)return 0;const c=(Number(r.ms)||0)+(Number(r.ac)||0),v=Number(r.rv)||0;return c===0?0:Math.round(((v-c)/c)*100)}
function hs(c){
  let s=0,ch=[];
  if(c.pstatus==='\u05e9\u05d5\u05dc\u05dd'){s+=25;ch.push({ok:1,t:'\u05ea\u05e9\u05dc\u05d5\u05dd \u05e2\u05d3\u05db\u05e0\u05d9'})}
  else if(c.pstatus==='\u05de\u05de\u05ea\u05d9\u05df'){s+=10;ch.push({ok:2,t:'\u05de\u05de\u05ea\u05d9\u05df \u05dc\u05ea\u05e9\u05dc\u05d5\u05dd'})}
  else ch.push({ok:0,t:'\u05d1\u05e4\u05d9\u05d2\u05d5\u05e8 \u05ea\u05e9\u05dc\u05d5\u05dd'});
  if(c.end&&days(c.end)>30){s+=20;ch.push({ok:1,t:'\u05d7\u05d5\u05d6\u05d4 \u05ea\u05e7\u05e3'})}
  else if(c.end&&days(c.end)>0){s+=8;ch.push({ok:2,t:'\u05d7\u05d9\u05d3\u05d5\u05e9 \u05d1\u05e7\u05e8\u05d5\u05d1'})}
  else ch.push({ok:0,t:'\u05d7\u05d5\u05d6\u05d4 \u05e4\u05d2'});
  if(c.log&&c.log.length){const df=(Date.now()-new Date(c.log[0].d))/(864e5);
    if(df<=30){s+=20;ch.push({ok:1,t:'\u05e4\u05e2\u05d9\u05dc\u05d5\u05ea \u05de\u05ea\u05d5\u05e2\u05d3\u05ea'})}
    else{s+=5;ch.push({ok:2,t:'\u05d0\u05d9\u05df \u05e4\u05e2\u05d9\u05dc\u05d5\u05ea \u05de\u05e2\u05dc 30 \u05d9\u05d5\u05dd'})}}
  else ch.push({ok:0,t:'\u05d0\u05d9\u05df \u05dc\u05d5\u05d2'});
  if(c.svcs&&c.svcs.length){s+=15;ch.push({ok:1,t:'\u05e9\u05d9\u05e8\u05d5\u05ea\u05d9\u05dd \u05de\u05d5\u05d2\u05d3\u05e8\u05d9\u05dd'})}
  else ch.push({ok:0,t:'\u05d0\u05d9\u05df \u05e9\u05d9\u05e8\u05d5\u05ea\u05d9\u05dd'});
  if(c.roi&&c.roi.rv){const r=cROI(c.roi);s+=r>=0?20:5;ch.push({ok:r>=0?1:2,t:'ROI '+(r>=0?'\u05d7\u05d9\u05d5\u05d1\u05d9':'\u05e9\u05dc\u05d9\u05dc\u05d9')+' ('+r+'%)'})}
  else ch.push({ok:2,t:'ROI \u05dc\u05d0 \u05d7\u05d5\u05e9\u05d1'});
  return{score:Math.min(s,100),checks:ch};
}

let clients=[], curId=null;
function sv2(){const e=document.getElementById('sv');e.style.display='block';setTimeout(()=>e.style.display='none',1500)}
function saveC(c){sv2();return db.collection(COL).doc(String(c.id)).set(c)}
function delC(id){return db.collection(COL).doc(String(id)).delete()}

db.collection(COL).onSnapshot(snap=>{
  clients=[];
  snap.forEach(d=>clients.push(d.data()));
  clients.sort((a,b)=>(a.name||'').localeCompare(b.name||'','he'));
  render();
});

function rAlerts(){
  const bar=document.getElementById('ab'),items=[];
  clients.forEach(c=>{
    if(c.pstatus==='\u05d1\u05e4\u05d9\u05d2\u05d5\u05e8')items.push('\u05ea\u05e9\u05dc\u05d5\u05dd \u05d1\u05e4\u05d9\u05d2\u05d5\u05e8: '+c.name);
    if(c.end&&days(c.end)<=30&&days(c.end)>0)items.push('\u05d7\u05d9\u05d3\u05d5\u05e9 \u05d1\u05e7\u05e8\u05d5\u05d1: '+c.name+' ('+days(c.end)+' \u05d9\u05de\u05d9\u05dd)');
  });
  if(items.length){bar.style.display='flex';bar.innerHTML='<b style="font-size:12px;color:#92400e">\u26a0 \u05d4\u05ea\u05e8\u05d0\u05d5\u05ea:</b>'+items.map(i=>'<span class="ai">'+i+'</span>').join('')}
  else bar.style.display='none';
}

function rStats(){
  const t=clients.length,pd=clients.filter(c=>c.pstatus==='\u05e9\u05d5\u05dc\u05dd').length;
  const pn=clients.filter(c=>c.pstatus!=='\u05e9\u05d5\u05dc\u05dd').length;
  const rv=clients.reduce((s,c)=>s+(Number(c.amount)||0),0);
  const rn=clients.filter(c=>days(c.end)<=30&&days(c.end)>0).length;
  const ah=t?Math.round(clients.reduce((s,c)=>s+hs(c).score,0)/t):0;
  document.getElementById('st').innerHTML=
    '<div class="stat"><div class="lbl">\u05dc\u05e7\u05d5\u05d7\u05d5\u05ea</div><div class="val" style="color:#2563eb">'+t+'</div></div>'+
    '<div class="stat"><div class="lbl">\u05e9\u05d5\u05dc\u05de\u05d5</div><div class="val" style="color:#16a34a">'+pd+'</div></div>'+
    '<div class="stat"><div class="lbl">\u05de\u05de\u05ea\u05d9\u05e0\u05d9\u05dd</div><div class="val" style="color:#ea580c">'+pn+'</div></div>'+
    '<div class="stat"><div class="lbl">\u05d4\u05db\u05e0\u05e1\u05d4 \u05d7\u05d5\u05d3\u05e9\u05d9\u05ea</div><div class="val">\u20aa'+rv.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="lbl">\u05d7\u05d9\u05d3\u05d5\u05e9 \u05d1\u05e7\u05e8\u05d5\u05d1</div><div class="val" style="color:#dc2626">'+rn+'</div></div>'+
    '<div class="stat"><div class="lbl">\u05d1\u05e8\u05d9\u05d0\u05d5\u05ea \u05de\u05de\u05d5\u05e6\u05e2\u05ea</div><div class="val" style="color:'+hc(ah)+'">'+ah+'%</div></div>';
}

function render(){

  const fs=document.getElementById('fS').value;
  const fp=document.getElementById('fP').value;
  const list=clients.filter(c=>{
    if(q&&!(c.name||'').toLowerCase().includes(q)&&!(c.contact||'').toLowerCase().includes(q))return false;
    if(fs&&!(c.svcs||[]).includes(fs))return false;
    if(fp&&c.pstatus!==fp)return false;

  });
  document.getElementById('gr').innerHTML=list.map(c=>{
    const al=days(c.end)<=30&&days(c.end)>0,lt=c.pstatus==='\u05d1\u05e4\u05d9\u05d2\u05d5\u05e8';

      '<div style="text-align:left"><div style="font-size:20px;font-weight:700;color:'+hc(h.score)+'">'+h.score+'</div><div style="font-size:10px;color:#999">\u05d1\u05e8\u05d9\u05d0\u05d5\u05ea</div></div></div>'+
      '<div class="hbar"><div style="width:'+h.score+'%;background:'+hc(h.score)+'"></div></div>'+
      '<div class="badges">'+((c.svcs||[]).map(s=>'<span class="badge bs">'+s+'</span>').join('')||'<span style="font-size:11px;color:#ccc">\u05d0\u05d9\u05df \u05e9\u05d9\u05e8\u05d5\u05ea\u05d9\u05dd</span>')+
      (c.pay||[]).map(p=>'<span class="badge bp">'+p+'</span>').join('')+
      (roi!==0?'<span class="badge bw">ROI '+roi+'%</span>':'')+

      '<div><div class="ml">\u05ea\u05e9\u05dc\u05d5\u05dd</div><div class="mv">\u20aa'+(Number(c.amount)||0).toLocaleString()+'</div></div>'+
      '<div><div class="ml">\u05e1\u05d8\u05d8\u05d5\u05e1</div><div class="mv"><span class="dot '+dc(c.pstatus)+'"></span>'+c.pstatus+'</div></div>'+
      '<div><div class="ml">\u05d5\u05ea\u05e7</div><div class="mv">'+tenure(c.start)+'</div></div>'+
      '<div><div class="ml">\u05d7\u05d5\u05d6\u05d4 \u05e2\u05d3</div><div class="mv">'+fd(c.end)+(al?' \u26a0':'')+'</div></div>'+
      '</div><div class="ca">'+
      '<button class="btn btn-blue btn-xs" onclick="event.stopPropagation();openV(\''+c.id+'\');setTimeout(()=>swById(\'pay\'),100)">\u05ea\u05e9\u05dc\u05d5\u05de\u05d9\u05dd</button>'+

      '<button class="btn btn-gray btn-xs" onclick="event.stopPropagation();expC(\''+c.id+'\')">PDF</button>'+
      '</div></div>';
  }).join('')||'<div style="color:#aaa;font-size:14px;padding:20px">\u05dc\u05d0 \u05e0\u05de\u05e6\u05d0\u05d5 \u05dc\u05e7\u05d5\u05d7\u05d5\u05ea</div>';
}

function openV(id){
  curId=id;
  const c=clients.find(x=>x.id===id);
  if(!c)return;
  document.getElementById('vt').textContent=c.name;
  document.querySelectorAll('.tabs .tab').forEach((t,i)=>t.classList.toggle('on',i===0));
  document.querySelectorAll('.tc').forEach((t,i)=>t.classList.toggle('on',i===0));

function bROI(c){
  const roi=c.roi||{};const rv=cROI(roi);
  const cost=(Number(roi.ms)||0)+(Number(roi.ac)||0),profit=(Number(roi.rv)||0)-cost;
  document.getElementById('tc-roi').innerHTML=
    '<div class="roi-box">'+
    '<div style="font-size:12px;opacity:.8;margin-bottom:4px">ROI \u05e0\u05d5\u05db\u05d7\u05d9</div>'+
    '<div class="roi-big">'+rv+'%</div>'+
    '<div class="roi-grid">'+
    '<div class="rc"><div class="rl">\u05e2\u05dc\u05d5\u05ea</div><div class="rv">\u20aa'+cost.toLocaleString()+'</div></div>'+
    '<div class="rc"><div class="rl">\u05d4\u05db\u05e0\u05e1\u05d4</div><div class="rv">\u20aa'+(Number(roi.rv)||0).toLocaleString()+'</div></div>'+
    '<div class="rc"><div class="rl">\u05e8\u05d5\u05d5\u05d7</div><div class="rv">\u20aa'+profit.toLocaleString()+'</div></div>'+
    '</div></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
    '<div class="fg"><label>\u05ea\u05e7\u05e6\u05d9\u05d1 \u05de\u05d3\u05d9\u05d4 (\u20aa)</label><input type="number" id="rms" value="'+(roi.ms||'')+'" oninput="prvROI()"/></div>'+
    '<div class="fg"><label>\u05e2\u05dc\u05d5\u05ea \u05e1\u05d5\u05db\u05e0\u05d5\u05ea (\u20aa)</label><input type="number" id="rac" value="'+(roi.ac||c.amount||'')+'" oninput="prvROI()"/></div>'+
    '<div class="fg"><label>\u05d4\u05db\u05e0\u05e1\u05d4 \u05e9\u05e0\u05d5\u05e6\u05e8\u05d4 (\u20aa)</label><input type="number" id="rrv" value="'+(roi.rv||'')+'" oninput="prvROI()"/></div>'+
    '<div class="fg"><label>\u05dc\u05d9\u05d3\u05d9\u05dd</label><input type="number" id="rld" value="'+(roi.ld||'')+'" oninput="prvROI()"/></div>'+
    '<div class="fg"><label>\u05e2\u05e8\u05da \u05e2\u05e1\u05e7\u05d4 \u05de\u05de\u05d5\u05e6\u05e2 (\u20aa)</label><input type="number" id="rad" value="'+(roi.ad||'')+'" oninput="prvROI()"/></div></div>'+
    '<div id="rp" style="background:#f8f9fa;border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px;display:none"></div>'+
    '<button class="btn btn-blue btn-sm" onclick="savROI(\''+c.id+'\')">\u05e9\u05de\u05d5\u05e8 ROI</button> <span id="rm" style="font-size:12px;color:#16a34a"></span>';
}

function prvROI(){
  const ms=Number(document.getElementById('rms').value)||0;
  const ac=Number(document.getElementById('rac').value)||0;
  const rv=Number(document.getElementById('rrv').value)||0;
  const ld=Number(document.getElementById('rld').value)||0;
  const ad=Number(document.getElementById('rad').value)||0;
  const cost=ms+ac,profit=rv-cost,roi=cost>0?Math.round(((rv-cost)/cost)*100):0;
  const p=document.getElementById('rp');
  p.style.display='block';
  p.innerHTML='<b>ROI = '+roi+'%</b> | \u05e8\u05d5\u05d5\u05d7 = \u20aa'+profit.toLocaleString()+(ld?' | \u05e2\u05dc\u05d5\u05ea \u05dc\u05dc\u05d9\u05d3 = \u20aa'+Math.round(cost/ld).toLocaleString():'')+(ld&&ad?' | \u05e1\u05d2\u05d9\u05e8\u05d4 \u05e4\u05d5\u05d8. = \u20aa'+(ld*ad).toLocaleString():'');
}

function savROI(id){
  const c=clients.find(x=>x.id===id);
  c.roi={ms:document.getElementById('rms').value,ac:document.getElementById('rac').value,rv:document.getElementById('rrv').value,ld:document.getElementById('rld').value,ad:document.getElementById('rad').value};
  saveC(c).then(()=>{const m=document.getElementById('rm');if(m){m.textContent='\u05e0\u05e9\u05de\u05e8!';setTimeout(()=>{if(m)m.textContent=''},2000)}});
}

  const tpl='\u05d4\u05e6\u05e2\u05ea \u05de\u05d7\u05d9\u05e8\n\u05de\u05ea\u05d0\u05e8\u05d9\u05da: '+today+'\n\n\u05dc\u05db\u05d1\u05d5\u05d3: '+(c.contact||c.name)+'\n\u05d7\u05d1\u05e8\u05d4: '+c.name+(c.biznum?' | \u05d7.\u05e4: '+c.biznum:'')+'\n\n\u05e9\u05dc\u05d5\u05dd \u05e8\u05d1,\n\n\u05dc\u05d4\u05dc\u05df \u05d4\u05e6\u05e2\u05ea \u05d4\u05de\u05d7\u05d9\u05e8:\n\n'+sl+'\n\n\u05e1\u05d4"\u05db: \u20aa'+(Number(c.amount)||0).toLocaleString()+' \u05dc\u05d7\u05d5\u05d3\u05e9\n\u05de\u05d5\u05d3\u05dc \u05ea\u05e9\u05dc\u05d5\u05dd: '+(c.pay||[]).join(', ')+'\n\n\u05ea\u05d5\u05e7\u05e3 \u05d4\u05e6\u05e2\u05d4: 14 \u05d9\u05d5\u05dd\n\u05ea\u05e0\u05d0\u05d9 \u05ea\u05e9\u05dc\u05d5\u05dd: \u05e9\u05d5\u05d8\u05e3 + 30\n\n\u05d1\u05d1\u05e8\u05db\u05d4,\nRobit Digital';
  document.getElementById('tc-quote').innerHTML=
    '<div style="font-size:12px;color:#888;margin-bottom:8px">\u05e0\u05d9\u05ea\u05df \u05dc\u05e2\u05e8\u05d5\u05da \u05dc\u05e4\u05e0\u05d9 \u05e9\u05dc\u05d9\u05d7\u05d4</div>'+
    '<textarea class="qa" id="qt">'+tpl+'</textarea>'+
    '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn btn-blue" onclick="sendQ(\''+c.id+'\')">\u05e9\u05dc\u05d7 \u05d1\u05de\u05d9\u05d9\u05dc &#8599;</button>'+
    '<button class="btn btn-green" onclick="copyQ()">\u05d4\u05e2\u05ea\u05e7 \u05d8\u05e7\u05e1\u05d8</button></div>'+
    '<div id="qm" style="font-size:12px;color:#16a34a;margin-top:6px"></div>';
}

function sendQ(id){
  const c=clients.find(x=>x.id===id);
  const txt=document.getElementById('qt').value;
  window.location.href='mailto:'+(c.email||'')+'?subject='+encodeURIComponent('\u05d4\u05e6\u05e2\u05ea \u05de\u05d7\u05d9\u05e8 \u2014 '+c.name)+'&body='+encodeURIComponent(txt);
}

function copyQ(){
  navigator.clipboard.writeText(document.getElementById('qt').value).then(()=>{
    const m=document.getElementById('qm');if(m){m.textContent='\u05d4\u05d5\u05e2\u05ea\u05e7!';setTimeout(()=>{if(m)m.textContent=''},2000)}
  });
}

function expC(id){
  const c=clients.find(x=>x.id===id);
  const h=hs(c),roi=cROI(c.roi||{});
  const w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><title>\u05d3\u05d5\u05d7 '+c.name+'</title><style>body{font-family:Arial,sans-serif;direction:rtl;padding:30px;max-width:800px;margin:0 auto}h1{font-size:22px}h2{font-size:15px;border-bottom:1px solid #ddd;padding-bottom:6px;margin:20px 0 10px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:#f8f9fa;padding:10px;border-radius:6px}.c label{font-size:10px;color:#888;display:block;font-weight:700;text-transform:uppercase}.c .v{font-size:14px;font-weight:600}.r{padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px}@media print{button{display:none}}</style></head><body>');
  w.document.write('<h1>'+c.name+'</h1><p style="color:#888;font-size:13px">'+new Date().toLocaleDateString('he-IL')+'</p>');
  w.document.write('<h2>\u05e4\u05e8\u05d8\u05d9\u05dd</h2><div class="g">');
  w.document.write('<div class="c"><label>\u05d0\u05d9\u05e9 \u05e7\u05e9\u05e8</label><div class="v">'+(c.contact||'\u2014')+'</div></div>');
  w.document.write('<div class="c"><label>\u05d0\u05d9\u05de\u05d9\u05d9\u05dc</label><div class="v">'+(c.email||'\u2014')+'</div></div>');
  w.document.write('<div class="c"><label>\u05e9\u05d9\u05e8\u05d5\u05ea\u05d9\u05dd</label><div class="v">'+(c.svcs||[]).join(', ')+'</div></div>');
  w.document.write('<div class="c"><label>\u05e1\u05db\u05d5\u05dd \u05d7\u05d5\u05d3\u05e9\u05d9</label><div class="v">\u20aa'+(Number(c.amount)||0).toLocaleString()+'</div></div>');
  w.document.write('<div class="c"><label>\u05e1\u05d8\u05d8\u05d5\u05e1</label><div class="v">'+c.pstatus+'</div></div>');
  w.document.write('<div class="c"><label>\u05d5\u05ea\u05e7</label><div class="v">'+tenure(c.start)+'</div></div>');
  w.document.write('<div class="c"><label>\u05d7.\u05e4</label><div class="v">'+(c.biznum||'\u2014')+'</div></div>');
  w.document.write('<div class="c"><label>\u05d1\u05e8\u05d9\u05d0\u05d5\u05ea</label><div class="v" style="color:'+hc(h.score)+'">'+h.score+'/100</div></div>');
  w.document.write('</div>');
  if(c.payments&&c.payments.length){w.document.write('<h2>\u05ea\u05e9\u05dc\u05d5\u05de\u05d9\u05dd</h2>'+c.payments.map(p=>'<div class="r"><span>'+p.month+'</span> <span>\u20aa'+(Number(p.amount)||0).toLocaleString()+'</span> <span>'+p.status+'</span>'+(p.link?'<a href="'+p.link+'">\u05d0\u05d9\u05e9\u05d5\u05e8</a>':'')+'</div>').join(''))}
  if(c.log&&c.log.length){w.document.write('<h2>\u05dc\u05d5\u05d2 \u05e4\u05e2\u05d9\u05dc\u05d5\u05ea</h2>'+c.log.map(l=>'<div class="r"><b>'+l.d+'</b> ('+l.by+') — '+l.t+'</div>').join(''))}
  if(c.docs&&c.docs.length){w.document.write('<h2>\u05de\u05e1\u05de\u05db\u05d9\u05dd</h2>'+c.docs.map(d=>'<div class="r">'+d.cat+': '+d.label+' <a href="'+d.url+'">\u05e7\u05d9\u05e9\u05d5\u05e8</a></div>').join(''))}
  w.document.write('<br><button onclick="window.print()" style="padding:8px 16px;background:#1d2b4f;color:#fff;border:none;border-radius:6px;cursor:pointer">\u05d4\u05d3\u05e4\u05e1 / PDF</button></body></html>');
  w.document.close();
}

function expAll(){
  const w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><title>\u05d3\u05d5\u05d7 \u05db\u05dc\u05dc\u05d9</title><style>body{font-family:Arial,sans-serif;direction:rtl;padding:30px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #ddd;padding:8px;text-align:right}th{background:#1d2b4f;color:#fff}@media print{button{display:none}}</style></head><body>');
  w.document.write('<h1>\u05d3\u05d5\u05d7 \u05e1\u05d5\u05db\u05e0\u05d5\u05ea \u2014 '+new Date().toLocaleDateString('he-IL')+'</h1>');
  w.document.write('<table><tr><th>\u05e9\u05dd</th><th>\u05d0\u05d9\u05e9 \u05e7\u05e9\u05e8</th><th>\u05e9\u05d9\u05e8\u05d5\u05ea\u05d9\u05dd</th><th>\u05e1\u05db\u05d5\u05dd</th><th>\u05e1\u05d8\u05d8\u05d5\u05e1</th><th>\u05d1\u05e8\u05d9\u05d0\u05d5\u05ea</th><th>ROI</th><th>\u05e1\u05d9\u05d5\u05dd</th></tr>');
  clients.forEach(c=>{const h=hs(c),roi=cROI(c.roi||{});

function sw(name,btn){
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.tc').forEach(t=>t.classList.remove('on'));
  document.getElementById('tc-'+name).classList.add('on');
}

function swById(name){
  document.querySelectorAll('.tabs .tab').forEach(t=>{t.classList.toggle('on',t.getAttribute('onclick').includes("\'"+name+"\'"))});
  document.querySelectorAll('.tc').forEach(t=>t.classList.remove('on'));
  const el=document.getElementById('tc-'+name);if(el)el.classList.add('on');
}

function cl(id){document.getElementById(id).classList.remove('open')}

function openNew(){
  document.querySelectorAll('#nOv .tag').forEach(t=>t.classList.remove('on'));
  ['nn','nc','nph','nem','nad','nwb','nbn','nnt'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  ['nam'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  ['nst','nen'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  document.getElementById('nOv').classList.add('open');
}

function tog(el){el.classList.toggle('on')}

function saveNew(){
  const name=document.getElementById('nn').value.trim();
  if(!name){alert('\u05e9\u05dd \u05e2\u05e1\u05e7 \u05d7\u05d5\u05d1\u05d4');return}
  const c={
    id:'c'+Date.now(),name,
    contact:document.getElementById('nc').value,
    phone:document.getElementById('nph').value,
    email:document.getElementById('nem').value,
    address:document.getElementById('nad').value,
    website:document.getElementById('nwb').value,
    biznum:document.getElementById('nbn').value,
    source:document.getElementById('nsr').value,
    agent:document.getElementById('nag').value,
    start:document.getElementById('nst').value,
    end:document.getElementById('nen').value,
    amount:Number(document.getElementById('nam').value)||0,
    pstatus:document.getElementById('nps').value,
    notes:document.getElementById('nnt').value,
    svcs:[...document.querySelectorAll('#nsvcs .tag.on')].map(t=>t.textContent),
    eng:[...document.querySelectorAll('#neng .tag.on')].map(t=>t.textContent),
    pay:[...document.querySelectorAll('#npay .tag.on')].map(t=>t.textContent),
    color:AVC[clients.length%AVC.length],
    log:[],payments:[],camps:[],docs:[],roi:{}
  };
  saveC(c).then(()=>cl('nOv'));
}
